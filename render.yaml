services:
  - type: web
    name: paper-agent-v2-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MODEL_NAME
        sync: false
      - key: MODEL_API_KEY
        sync: false
      - key: MODEL_BASE_URL
        sync: false
      - key: DEFAULT_MAX_PAPERS
        value: "10"
      - key: MAX_PAPERS_LIMIT
        value: "10"
      - key: PYTHONUNBUFFERED
        value: "1"
