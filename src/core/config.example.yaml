# Paper-Agent-v2 配置模板
# 所有节点统一使用同一个 OpenAI 兼容纯文本模型

model:
  name: ${MODEL_NAME}
  api_key: ${MODEL_API_KEY}
  base_url: ${MODEL_BASE_URL}
  capabilities:
    vision: false
    function_calling: true
    json_output: true
    structured_output: true
    family: unknown

search_node:
  use_llm: true
  candidate_pool_min: 20
  candidate_pool_multiplier: 5
  candidate_pool_max: 50
  filter_batch_size: 20
  download_pdf: true
  pdf_download_dir: data/papers
  default_time_range:
    enabled: false
    lookback_years: 5
  default_sort_by: relevance

read_node:
  concurrency: 2
  max_tokens_threshold: 25000
  use_images: false
  image:
    detail: low
    dpi: 150
    max_size: 1024
  verify:
    enabled: true
    max_retries_per_paper: 3
    fields_to_verify:
      - key_methodology
      - main_results
      - limitations

default_max_papers: 1
