# Paper-Agent-v2 模型配置模板
# 复制本文件为 config.yaml 后填入真实值

# 默认模型，当 search-model / reading-model 等未配置时作为兜底
default-model:
  model-provider: mimo
  model: mimo-v2.5
  # api_key 可以直接填写，也可以引用 .env 中的环境变量名
  api_key: ${MIMO_API_KEY}
  base_url: https://opencode.ai/zen/go/v1

# 搜索节点专用模型（可选，未配置时回退到 default-model）
search-model:
  model-provider: mimo
  model: mimo-v2.5
  api_key: ${MIMO_API_KEY}
  base_url: https://opencode.ai/zen/go/v1

# 阅读节点专用模型（可选）
reading-model:
  model-provider: mimo
  model: mimo-v2.5
  api_key: ${MIMO_API_KEY}
  base_url: https://opencode.ai/zen/go/v1
  use_images: true
  image:
    detail: low
    dpi: 150
    max_size: 1024
