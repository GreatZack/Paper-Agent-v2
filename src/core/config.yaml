# Paper-Agent-v2 模型配置
# 所有节点统一使用同一个 OpenAI 兼容纯文本模型

model:
  name: ${MODEL_NAME}
  api_key: ${MODEL_API_KEY}
  base_url: ${MODEL_BASE_URL}
  capabilities:
    vision: false
    function_calling: true
    json_output: true
    structured_output: true
    family: unknown

# 搜索节点配置（预留字段，当前未全部启用）
search_node:
  # 是否使用 LLM 生成查询条件
  use_llm: true
  # 候选池与最终返回数量分离
  candidate_pool_min: 20
  candidate_pool_multiplier: 5
  candidate_pool_max: 50
  filter_batch_size: 20
  # 是否下载 PDF
  download_pdf: true
  # PDF 下载目录
  pdf_download_dir: data/papers
  # 默认时间范围策略（预留，当前未启用）
  default_time_range:
    enabled: false
    lookback_years: 5
  # 默认排序策略（预留，当前未启用）
  # 可选值: relevance | submitted_date
  default_sort_by: relevance

# 阅读节点配置
read_node:
  # 并发处理论文数
  concurrency: 2
  # 超过此 token 数触发 section 切块
  max_tokens_threshold: 25000
  # Render 免费实例使用纯文本模式，保留图片参数以便未来重新启用
  use_images: false
  image:
    detail: low
    dpi: 150
    max_size: 1024
  # 证据验证配置
  verify:
    enabled: true                     # 是否启用验证
    max_retries_per_paper: 3          # 单篇最大验证重试次数
    fields_to_verify:                 # 需验证的字段列表
      - key_methodology
      - main_results
      - limitations
    optional_fields:                  # 原文未提及时允许标记为“未提及”
      - limitations

# 全局默认配置
default_max_papers: 1
