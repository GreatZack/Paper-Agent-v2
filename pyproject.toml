[tool.poetry]
name = "Paper-Agent-v2"
version = "0.1.0"
description = "LangGraph-based search-read-parse-write workflow skeleton"
authors = ["Tswoen <15071340+tswoen@user.noreply.gitee.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
pydantic = "^2.0"
langgraph = "^0.6.7"
tenacity = ">=9.1.2,<10.0.0"
arxiv = ">=2.2.0,<3.0.0"
autogen-agentchat = "^0.7.4"
autogen-ext = {extras = ["openai"], version = "^0.7.4"}
python-dotenv = ">=1.1.1,<2.0.0"
pyyaml = ">=6.0.2,<7.0.0"
pymupdf4llm = ">=0.1.0"

[[tool.poetry.source]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
priority = "primary"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
